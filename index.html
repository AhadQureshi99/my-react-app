<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/flogo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>Growhm Tech | Branding & Design Agency</title>
    <meta
      name="description"
      content="Growhm Tech is a leading branding and design agency specializing in UI/UX design, web development, brand strategy, and digital experiences that help businesses grow."
    />
    <meta
      name="keywords"
      content="branding agency, design agency, UI/UX design, web development, brand strategy, digital design, Growhm Tech"
    />
    <meta name="author" content="Growhm Tech" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Growhm Tech | Branding & Design Agency"
    />
    <meta
      property="og:description"
      content="Transform your brand with innovative design solutions. Expert UI/UX, web development, and brand strategy."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:url" content="https://growhm.tech" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Growhm Tech | Branding & Design Agency"
    />
    <meta
      name="twitter:description"
      content="Transform your brand with innovative design solutions."
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#030712" />

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  </head>
  <body class="bg-gray-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
